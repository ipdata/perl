name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let every Perl finish so one failure does not cancel the others
      matrix:
        perl-version: ['5.14', '5.20', '5.26', '5.32', '5.38', '5.40', '5.42', '5.44']

    name: Perl ${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install dependencies
        run: cpanm --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test
