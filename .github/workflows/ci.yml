name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version: ['5.14', '5.20', '5.26', '5.32', '5.38', '5.40']

    name: Perl ${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test
