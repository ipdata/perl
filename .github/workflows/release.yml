name: Release to CPAN

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to upload (for example v1.2.0)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the tag passed by the calling workflow, or the published release's tag
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules-with: cpanm
          install-modules: CPAN::Uploader

      - name: Install dependencies
        run: cpanm --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          make
          make test

      - name: Build distribution
        run: make dist

      - name: Upload to CPAN
        env:
          CPAN_USERNAME: ${{ secrets.CPAN_USERNAME }}
          CPAN_PASSWORD: ${{ secrets.CPAN_PASSWORD }}
        run: cpan-upload -u "$CPAN_USERNAME" -p "$CPAN_PASSWORD" Net-IPData-*.tar.gz
